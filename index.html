<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>رياضياتي</title>
<style>
:root{--bg:#fff6df;--ink:#2b2350;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:max(14px,env(safe-area-inset-top)) 14px 24px}
h1{font-size:34px;margin:6px 0;text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pill{background:#fff;border:3px solid var(--ink);border-radius:30px;padding:6px 14px;font-size:22px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.act{border:4px solid var(--ink);border-radius:26px;padding:14px 6px;font:inherit;font-size:21px;font-weight:700;color:var(--ink);box-shadow:0 6px 0 var(--ink);min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.act .ic{font-size:44px;line-height:1.1}.act .st{font-size:18px;letter-spacing:2px}
.act:active,.ans:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.dots{display:flex;gap:5px;flex:1;justify-content:center}
.dot{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--ink)}.dot.on{background:#ffb800}.dot.cur{background:var(--ink)}
.btn{border:3px solid var(--ink);background:#fff;border-radius:18px;font-size:26px;width:56px;height:52px;color:var(--ink)}
.q{background:var(--card);border:4px solid var(--ink);border-radius:28px;padding:16px 10px;text-align:center;margin-bottom:16px}
.p{font-size:28px;font-weight:700;margin-bottom:10px}
.vis{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;align-items:center;min-height:90px;direction:ltr}
.grp{display:inline-flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:250px;direction:ltr}
.it{font-size:38px;line-height:1.15}.it.cr{opacity:.25;filter:grayscale(1)}
.op{font-size:40px;font-weight:700}
.eq{font-size:46px;font-weight:700;direction:ltr;width:100%}
.big{font-size:64px;font-weight:700}
.answers{display:grid;gap:12px;grid-template-columns:repeat(var(--c,3),1fr)}
.ans{border:4px solid var(--ink);background:#fff;border-radius:24px;box-shadow:0 6px 0 var(--ink);min-height:92px;font:inherit;font-size:40px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:6px}
.ans.ok{background:#8be28b}.ans.no{background:#ff9d9d;animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.msg{text-align:center;font-size:28px;font-weight:700;min-height:44px;margin-top:14px}
.res{text-align:center;margin-top:40px}.res .big{font-size:80px}
.go{border:4px solid var(--ink);border-radius:24px;background:#ffb800;font:inherit;font-size:28px;font-weight:700;padding:12px 28px;margin:8px;box-shadow:0 6px 0 var(--ink);color:var(--ink)}
svg.sh{width:78px;height:78px}
@media(prefers-reduced-motion:reduce){.ans.no{animation:none}}

body{background:radial-gradient(circle at 12% 8%,#fff 0 34px,transparent 35px),radial-gradient(circle at 24% 6%,#fff 0 26px,transparent 27px),radial-gradient(circle at 86% 14%,#fff 0 30px,transparent 31px),linear-gradient(#a9e4ff,#fff6df 42%) fixed}
h1{font-size:38px;color:#e63946;text-shadow:0 3px 0 #fff}
.pill{background:#ffe066;box-shadow:0 4px 0 var(--ink)}
.hero{display:flex;align-items:center;gap:10px;margin:4px 0}
.mas{font-size:64px;line-height:1}
.bubble{flex:1;background:#fff;border:4px solid var(--ink);border-radius:22px;padding:8px 12px;font-size:21px;font-weight:700}
.act{position:relative;overflow:hidden}
.act::after{content:"";position:absolute;inset:0 0 55% 0;background:linear-gradient(#ffffffa0,#fff0);pointer-events:none}
.act>*{position:relative;z-index:1}
.act .ic{background:#fff;border:3px solid var(--ink);border-radius:50%;width:62px;height:62px;display:flex;align-items:center;justify-content:center;font-size:34px}
.q{position:relative;margin-top:30px;box-shadow:0 6px 0 var(--ink)}
.mas.sm{position:absolute;top:-34px;left:12px;width:70px;height:70px;font-size:44px;background:#fff;border:4px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center}
.pop{animation:pop .55s}@keyframes pop{40%{transform:scale(1.35) rotate(-8deg)}}
.vis{flex-direction:column;align-items:center;gap:10px}
.grp{display:grid;grid-template-columns:repeat(5,46px);gap:4px;background:#ffffffc0;border:3px dashed #2b235090;border-radius:18px;padding:8px;width:max-content;max-width:100%}
.it{width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-size:32px;line-height:1;background:#fff;border:2px solid #2b235030;border-radius:10px;position:relative}
.it.cr{opacity:1;filter:none;background:#ffe3e3;border-color:#e63946}
.it.cr::after{content:"✖";position:absolute;font-size:44px;font-weight:900;color:#e63946}
.ans .grp{border:0;background:none;padding:0;grid-template-columns:repeat(5,28px);gap:3px}
.ans .it{width:28px;height:28px;font-size:20px;border-radius:6px}
.op{width:46px;height:46px;border-radius:50%;background:#ffbf00;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:32px;line-height:1}
.eq{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:4px 14px;display:inline-block;width:auto}
svg.sh{width:92px;height:92px}
.ans:nth-child(1){background:#ffd6d6}.ans:nth-child(2){background:#d6f5ff}.ans:nth-child(3){background:#fff3b0}
.ans.ok{background:#7be07b!important;animation:pop .5s}.ans.no{background:#ff8f8f!important}
.dot.cur{animation:pop 1.2s infinite}
.cf{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:9;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(420deg)}}
@media(prefers-reduced-motion:reduce){.pop,.dot.cur,.cf{animation:none}}
</style></head><body><div id="app"></div>
<script>
const $=document.getElementById('app');
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const SH=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const EM=['🍎','🍌','⭐','🐟','🎈','🚗','🌸','🐥','🍓','⚽'];
const pick=()=>EM[R(0,EM.length-1)];
const W=['صفر','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة'];
const row=(n,e,x=0)=>'<span class="grp">'+Array.from({length:n},(_,k)=>`<span class="it${k<x?' cr':''}">${e}</span>`).join('')+'</span>';
const nums=(c,lo,hi,f=v=>v)=>{const s=new Set([c]);while(s.size<3)s.add(R(Math.max(lo,0),hi));return SH([...s]).map(v=>({h:f(v),ok:v===c}))};
const SHP={
 'دائرة':'<circle cx="40" cy="40" r="32"/>','مربع':'<rect x="10" y="10" width="60" height="60"/>',
 'مثلث':'<polygon points="40,8 72,70 8,70"/>','مستطيل':'<rect x="2" y="24" width="76" height="32"/>'};
const COL=['#e63946','#2a9d8f','#f4a261','#457b9d'];
const svg=(n,c)=>`<svg class="sh" viewBox="0 0 80 80" fill="${c}" stroke="#2b2350" stroke-width="4">${SHP[n]}</svg>`;
const ACTS=[
 {t:'عُدَّ معي',ic:'🔢',c:'#ffd6a5',g:i=>{const n=R(1,i<4?5:10);return{p:'كم عدد الأشياء؟',v:row(n,pick()),a:nums(n,Math.max(1,n-2),Math.min(10,n+2))}}},
 {t:'أتعرّف على العدد',ic:'✏️',c:'#caffbf',g:i=>{const n=R(1,10);return i%2?{p:'أيّ عدد هذا؟',v:`<div class="big" dir="ltr">${n}</div>`,a:nums(n,1,10,v=>`<span style="font-size:28px">${W[v]}</span>`)}:{p:'أيّ رقم يعني: '+W[n]+'؟',v:row(n,pick()),a:nums(n,1,10)}}},
 {t:'الجمع',ic:'➕',c:'#9bf6ff',g:i=>{const a=R(1,i<5?4:6),b=R(1,Math.min(5,10-a)),s=a+b,e=pick(),f=pick();return{p:'كم المجموع؟',v:(i<5?row(a,e)+'<span class="op">+</span>'+row(b,f):'')+`<div class="eq">${a} + ${b} = ؟</div>`,a:nums(s,Math.max(0,s-2),Math.min(10,s+2))}}},
 {t:'الطرح',ic:'➖',c:'#ffadad',g:i=>{const a=R(2,i<5?5:10),b=R(1,a-1),d=a-b;return{p:'كم يبقى؟',v:(i<5?row(a,pick(),b):'')+`<div class="eq">${a} − ${b} = ؟</div>`,a:nums(d,Math.max(0,d-2),Math.min(10,d+2))}}},
 {t:'أكثر أم أقل',ic:'⚖️',c:'#fdffb6',g:i=>{let a=R(1,9),b=R(1,9);while(a===b)b=R(1,9);const e=pick(),more=i%2===0;return{p:more?'أيّ مجموعة فيها أكثر؟':'أيّ مجموعة فيها أقل؟',v:'',c:2,a:[{h:row(a,e),ok:more?a>b:a<b},{h:row(b,e),ok:more?b>a:b<a}]}}},
 {t:'قبل وبعد',ic:'↔️',c:'#bdb2ff',g:i=>{const k=i%3;let n,p,s,c;if(k===0){n=R(1,9);p='ما العدد الذي بعد '+n+'؟';s=`${n} ، ؟`;c=n+1}else if(k===1){n=R(2,10);p='ما العدد الذي قبل '+n+'؟';s=`؟ ، ${n}`;c=n-1}else{n=R(2,9);p='ما العدد الناقص؟';s=`${n-1} ، ؟ ، ${n+1}`;c=n}return{p,v:`<div class="eq">${s}</div>`,a:nums(c,Math.max(0,c-2),Math.min(10,c+2))}}},
 {t:'الأشكال',ic:'🔺',c:'#ffc6ff',g:i=>{const ns=SH(Object.keys(SHP)),n=ns[0],cs=SH(COL);if(i%2)return{p:'ما اسم هذا الشكل؟',v:svg(n,cs[0]),a:SH(ns.slice(0,3)).map(x=>({h:`<span style="font-size:30px">${x}</span>`,ok:x===n}))};return{p:'أين '+n+'؟',v:'',a:SH(ns.slice(0,3)).map((x,k)=>({h:svg(x,cs[k]),ok:x===n}))}}},
 {t:'ماذا يأتي بعد؟',ic:'🧩',c:'#a0c4ff',g:i=>{const e=SH(EM),A=e[0],B=e[1],C=e[2];const P=[[A,B,A,B,A],[A,A,B,A,A],[A,B,C,A,B]][i<4?0:R(0,2)];const sq=[[A,B,A,B,A,B],[A,A,B,A,A,B],[A,B,C,A,B,C]][[[A,B,A,B,A],[A,A,B,A,A],[A,B,C,A,B]].indexOf(P)];const ok=sq[5],ch=SH([ok,...[A,B,C,e[3]].filter(x=>x!==ok).slice(0,2)]);return{p:'أكمل النمط',v:'<div class="eq" style="font-size:40px">'+P.join(' ')+' ❓</div>',a:ch.map(x=>({h:x,ok:x===ok}))}}}
];
let S={};try{S=JSON.parse(localStorage.getItem('m1')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('m1',JSON.stringify(S))}catch(e){}};
let AC;const tone=(f,d=.15,t=0)=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d)}catch(e){}};
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.85;speechSynthesis.speak(u)}catch(e){}};
const total=()=>Object.values(S).reduce((a,b)=>a+b,0);
const stars=n=>'⭐'.repeat(n)+'☆'.repeat(3-n);
const mas=e=>{const m=document.getElementById('mas');if(m){m.textContent=e;m.classList.remove('pop');void m.offsetWidth;m.classList.add('pop')}};
const boom=(k=22)=>{for(let i=0;i<k;i++){const s=document.createElement('span');s.className='cf';s.textContent=['🎉','⭐','✨','🎈','💖'][R(0,4)];s.style.left=R(2,92)+'%';s.style.animationDelay=(R(0,50)/100)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2300)}};
function home(){
 $.innerHTML=`<div class="top"><span></span><span class="pill" dir="ltr">⭐ ${total()} / ${ACTS.length*3}</span></div><div class="hero"><div class="mas">🦉</div><div class="bubble">مرحبًا يا بطل! هيا نلعب بالأرقام 🎈</div></div><h1>رياضياتي</h1><div class="grid">`+
 ACTS.map((a,k)=>`<button class="act" style="background:${a.c}" onclick="play(${k})"><span class="ic">${a.ic}</span>${a.t}<span class="st">${stars(S[k]||0)}</span></button>`).join('')+'</div>'}
let G;
function play(k){G={k,i:0,sc:0,tries:0,lock:0};ask()}
function ask(){
 if(G.i>=10)return end();
 const a=ACTS[G.k],q=a.g(G.i);G.q=q;G.tries=0;
 $.innerHTML=`<div class="top"><button class="btn" onclick="home()">🏠</button><div class="dots">${Array.from({length:10},(_,k)=>`<span class="dot ${k<G.i?'on':k===G.i?'cur':''}"></span>`).join('')}</div><button class="btn" onclick="say(G.q.p)">🔊</button></div>
 <div class="q" style="background:${a.c}"><div class="mas sm" id="mas">🦉</div><div class="p">${q.p}</div><div class="vis">${q.v}</div></div>
 <div class="answers" style="--c:${q.c||3}">${q.a.map((x,j)=>`<button class="ans" onclick="pickA(${j},this)">${x.h}</button>`).join('')}</div><div class="msg" id="m"></div>`;
 setTimeout(()=>say(q.p),250)}
function pickA(j,b){
 if(G.lock)return;const m=document.getElementById('m');
 if(G.q.a[j].ok){G.lock=1;b.classList.add('ok');boom();mas('🥳');if(!G.tries)G.sc++;tone(660,.12);tone(880,.2,.12);
  m.textContent=SH(['أحسنت! 🎉','ممتاز! ⭐','برافو! 👏','رائع! 🌟','عمل جميل! 💪'])[0];
  setTimeout(()=>{G.lock=0;G.i++;ask()},1100)}
 else{G.tries++;b.classList.add('no');mas('🤔');b.disabled=true;tone(220,.25);m.textContent=G.tries>1?'فكّر جيدًا، أنت قادر! 🙂':'حاول مرة أخرى 💪'}}
function end(){
 const n=G.sc>=9?3:G.sc>=6?2:G.sc>=3?1:0;if(n>(S[G.k]||0)){S[G.k]=n;save()}
 if(n)boom(40);[523,659,784,1047].forEach((f,k)=>tone(f,.18,k*.15));
 $.innerHTML=`<div class="res"><div class="mas pop" style="font-size:90px">${n===3?'🏆':n?'🥳':'🦉'}</div><div class="big">${n?stars(n):'💪'}</div><h1>${n===3?'مذهل!':n?'أحسنت!':'لنتدرّب أكثر'}</h1><div class="p">${G.sc} من 10</div>
 <button class="go" onclick="play(${G.k})">🔁 العب مجددًا</button><button class="go" style="background:#fff" onclick="home()">🏠 الرئيسية</button></div>`;
 setTimeout(()=>say(n===3?'مذهل! أحسنت':'أحسنت'),300)}
home();
</script></body></html>
